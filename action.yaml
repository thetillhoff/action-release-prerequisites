name: Release prerequisites
description: 'Checks whether the release-tag is mentioned in the changelog'

inputs:
  RELEASE_TAG:
    description: 'The tag of the release'
    required: true
  CHANGELOG_FILE:
    description: 'Location of the file that contains the changelog'
    required: false
    default: 'CHANGELOG.md'

outputs:
  RELEASE_BODY:
    description: 'Changelog section for this release'
    value: ${{ steps.release-body.outputs.RELEASE_BODY }}

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: '${{ inputs.RELEASE_TAG }}'

    # Every step below passes values in through `env` and reads them as shell
    # variables. A ${{ }} reference inside `run` is pasted into the script as
    # literal text before bash parses it, so changelog content would be read as
    # shell: a backtick or $( ) executes, and a double quote ends the string and
    # lets whatever follows run as commands.

    - name: Check whether the release-tag is mentioned in changelog
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.RELEASE_TAG }}
        CHANGELOG_FILE: ${{ inputs.CHANGELOG_FILE }}
      run: |
        # -F matches the tag literally. Without it the dots in a version are
        # regex wildcards, so v1.2.3 would also accept v1X2X3.
        grep -F -- "$RELEASE_TAG" "$CHANGELOG_FILE"

    - name: Generate release body
      id: release-body
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.RELEASE_TAG }}
        CHANGELOG_FILE: ${{ inputs.CHANGELOG_FILE }}
      run: |
        # The heading is compared as a literal string, so the tag is never treated
        # as a pattern. It is a prefix match rather than an equality one, because
        # some changelogs date their headings - "## v0.1.0 on 2023-10-14" - and
        # the release tag is only the first part. Trailing blank lines are dropped.
        BODY="$(
          awk -v heading="## $RELEASE_TAG" '
            !inside && substr($0, 1, length(heading)) == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { body[++n] = $0 }
            END {
              while (n > 0 && body[n] ~ /^[[:space:]]*$/) { n-- }
              for (i = 1; i <= n; i++) { print body[i] }
            }
          ' "$CHANGELOG_FILE"
        )"

        if [ -z "$BODY" ]; then
          echo "::error::No changelog section for $RELEASE_TAG in $CHANGELOG_FILE - expected a '## $RELEASE_TAG' heading followed by content"
          exit 1
        fi

        # A line in the body matching the delimiter would close the heredoc early,
        # truncating the release notes and turning every following line into a
        # step output of its own. Refuse rather than let that happen.
        DELIMITER="RELEASE_BODY_EOF"
        if printf '%s\n' "$BODY" | grep -qxF -- "$DELIMITER"; then
          echo "::error::$CHANGELOG_FILE contains a line reading $DELIMITER, which would terminate the release body early - remove or reword it"
          exit 1
        fi

        {
          printf '%s<<%s\n' "RELEASE_BODY" "$DELIMITER"
          printf '%s\n' "$BODY"
          printf '%s\n' "$DELIMITER"
        } >> "$GITHUB_OUTPUT"

    - name: Display release body
      shell: bash
      env:
        RELEASE_BODY: ${{ steps.release-body.outputs.RELEASE_BODY }}
      run: |
        printf '%s\n' "$RELEASE_BODY"
